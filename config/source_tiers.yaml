# Quy tắc phân hạng độ tin cậy của nguồn thông tin thị trường game (Hạng A / B / C)
# Theo BRIEF.md mục 4.2:
# - Hạng A: Dữ liệu gốc hoặc nhà cung cấp dữ liệu ngành, cơ quan nhà nước, báo cáo tài chính/IR của publisher niêm yết.
# - Hạng B: Truyền thông và phân tích ngành game uy tín, hãng tin và báo kinh tế/công nghệ lớn.
# - Hạng C: Mặc định (blog cá nhân, trang tổng hợp SEO, diễn đàn, thông cáo báo chí, domain chưa kiểm chứng).

tier_a:
  default_reason: "Nhà cung cấp dữ liệu ngành gốc / Báo cáo IR publisher niêm yết / Cơ quan quản lý nhà nước"
